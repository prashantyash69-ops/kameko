name: Build Kameko APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # This step safely provisions Gradle 8.4 instead of using the server's default Gradle 9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
            
      # We now run 'gradle' directly instead of './gradlew'
      - name: Build APK
        run: gradle assembleDebug
        
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk Kameko.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kameko-APK
          path: Kameko.apk
